name: Final parity validation

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exact-clippy-fix:
    name: Apply exact clippy fix to audit branch
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/final-parity-audit

      - name: Replace while-let lint exactly once
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path('src/adapters/audio_rodio_crlf.rs')
          data = path.read_bytes()
          nl = b'\r\n' if b'\r\n' in data else b'\n'

          old_import = b'use std::sync::mpsc::{self, Receiver, Sender, SyncSender, TryRecvError, TrySendError};'
          new_import = b'use std::sync::mpsc::{self, Receiver, Sender, SyncSender, TrySendError};'
          if data.count(old_import) != 1:
              raise SystemExit(f'expected one TryRecvError import, found {data.count(old_import)}')
          data = data.replace(old_import, new_import, 1)

          old_lines = [
              b'        loop {',
              b'            match self.statuses.try_recv() {',
              b'                Ok(status) => {',
              b'                    self.availability = status.clone();',
              b'                    changed = Some(status);',
              b'                }',
              b'                Err(TryRecvError::Empty | TryRecvError::Disconnected) => break,',
              b'            }',
              b'        }',
          ]
          new_lines = [
              b'        while let Ok(status) = self.statuses.try_recv() {',
              b'            self.availability = status.clone();',
              b'            changed = Some(status);',
              b'        }',
          ]
          old = nl.join(old_lines)
          new = nl.join(new_lines)
          if data.count(old) != 1:
              raise SystemExit(f'expected one refresh_status loop, found {data.count(old)}')
          data = data.replace(old, new, 1)
          path.write_bytes(data)
          '@ | python -

      - name: Commit exact fix
        shell: pwsh
        run: |
          git diff -- src/adapters/audio_rodio_crlf.rs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/adapters/audio_rodio_crlf.rs
          git commit -m 'Fix clippy while-let warning [skip ci]'
          git push origin HEAD:agent/final-parity-audit
