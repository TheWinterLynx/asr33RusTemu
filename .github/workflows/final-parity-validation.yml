name: Final parity validation

on:
  push:
    branches:
      - agent/final-parity-audit
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-validation:
    name: Windows Rust + Python parity gate
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python reference dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML pyserial pygame-ce pillow fonttools

      - name: Set up stable Rust with rustfmt and clippy
        shell: pwsh
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version
          cargo --version

      - name: Reject obsolete transport references
        shell: pwsh
        run: |
          @'
          import pathlib
          import re
          import subprocess
          import sys

          excluded = {'.github/workflows/final-parity-validation.yml'}
          pattern = re.compile(r'ssh|paramiko|SSHV2Backend|ssh_config|backend_ssh', re.IGNORECASE)
          hits = []
          for name in subprocess.check_output(['git', 'ls-files'], text=True).splitlines():
              if name in excluded:
                  continue
              path = pathlib.Path(name)
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              for line_number, line in enumerate(text.splitlines(), 1):
                  if pattern.search(line):
                      hits.append(f'{name}:{line_number}:{line}')
          if hits:
              print('\n'.join(hits))
              sys.exit('Obsolete transport reference found in tracked product files.')
          print('No obsolete transport references found.')
          '@ | python -

      - name: Rust formatting gate
        run: cargo fmt --check

      - name: Rust clippy gate
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rust unit and integration tests
        run: cargo test --all

      - name: Python characterization oracle tests
        run: python -m unittest discover -s tests -p "test_*characterization.py"

      - name: Release build
        run: cargo build --release

      - name: Windows binary CLI smoke test
        shell: pwsh
        run: .\target\release\asr33emu.exe --help
