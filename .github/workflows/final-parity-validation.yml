name: Final parity validation

on:
  push:
    branches:
      - agent/final-parity-audit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rustfmt-fix:
    name: Apply rustfmt to audit branch
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/final-parity-audit

      - name: Set up stable Rust with rustfmt
        shell: pwsh
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt

      - name: Apply rustfmt
        run: cargo fmt

      - name: Commit formatting if needed
        shell: pwsh
        run: |
          git diff --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'No rustfmt changes required.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.rs'
          git commit -m 'Apply rustfmt for final validation [skip ci]'
          git push origin HEAD:agent/final-parity-audit
