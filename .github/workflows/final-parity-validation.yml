name: Final parity validation

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  frontend-cleanup:
    name: Remove legacy frontend selector
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/final-parity-audit

      - name: Remove dead frontend compatibility surface
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once('src/core/config.rs', '    pub frontend: FrontendSection,\n', '')
          replace_once('src/core/config.rs', '    #[arg(long, value_enum)]\n    pub frontend: Option<FrontendConfigValue>,\n\n', '')
          replace_once('src/core/config.rs', '        if let Some(value) = self.frontend {\n            config.frontend.kind = value;\n        }\n', '')
          replace_once('src/core/config.rs', '''/// Values accepted from the legacy Python frontend setting.\n///\n/// These variants are compatibility inputs, not Rust UI architecture choices.\n#[derive(Clone, Copy, Debug, Eq, PartialEq, Serialize, Deserialize, ValueEnum)]\npub enum FrontendConfigValue {\n    #[serde(rename = "tkinter")]\n    #[value(name = "tkinter")]\n    LegacyTkinter,\n    #[serde(rename = "pygame")]\n    #[value(name = "pygame")]\n    LegacyPygame,\n}\n\n#[derive(Clone, Debug, Eq, PartialEq, Serialize, Deserialize)]\npub struct FrontendSection {\n    #[serde(rename = "type")]\n    pub kind: FrontendConfigValue,\n}\n\n''', '')

          for path in ['asr33_config.yaml', 'asr33_strict.yaml']:
              replace_once(path, 'frontend:\n  type: "tkinter"  # Options: "tkinter" | "pygame"\n\n', '')

          replace_once('tests/config_compat.rs', '            "--frontend",\n            "pygame",\n', '')
          replace_once('tests/config_compat.rs', '            "--frontend",\n            "tkinter",\n', '')
          '@ | python -

      - name: Format and inspect
        shell: pwsh
        run: |
          cargo fmt
          git diff --check
          git diff

      - name: Commit cleanup
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/config.rs asr33_config.yaml asr33_strict.yaml tests/config_compat.rs
          git commit -m 'Remove dead legacy frontend selector [skip ci]'
          git push origin HEAD:agent/final-parity-audit
