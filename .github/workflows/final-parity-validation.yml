name: Final parity validation

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  residual-frontend-cleanup:
    name: Remove residual frontend references
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/final-parity-audit

      - name: Remove residual legacy frontend code
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/app/config_controller.rs',
              '    Legacy,\n',
              ''
          )
          replace_once(
              'src/app/config_controller.rs',
              '        add(\n            old.frontend != new.frontend,\n            "legacy frontend",\n            ChangeClass::Legacy,\n        );\n',
              ''
          )

          replace_once(
              'src/ui/settings.rs',
              '            SettingsPage::General => general(ui, metrics, state, &mut self.draft_theme),\n',
              '            SettingsPage::General => general(ui, metrics, &mut self.draft_theme),\n'
          )
          replace_once(
              'src/ui/settings.rs',
              '        ChangeClass::Legacy => ("LEGACY", "Legacy compatibility input"),\n',
              ''
          )
          replace_once(
              'src/ui/settings.rs',
              'fn general(\n    ui: &mut egui::Ui,\n    metrics: SettingsUiMetrics,\n    state: &mut SettingsState,\n    theme: &mut ThemeKind,\n) {\n',
              'fn general(ui: &mut egui::Ui, metrics: SettingsUiMetrics, theme: &mut ThemeKind) {\n'
          )
          replace_once(
              'src/ui/settings.rs',
              '    section(ui, metrics, "Compatibility");\n    let legacy_frontend = match state.draft_config.frontend.kind {\n        FrontendConfigValue::LegacyTkinter => "tkinter",\n        FrontendConfigValue::LegacyPygame => "pygame",\n    };\n    ui.label(format!(\n        "frontend.type = {legacy_frontend} (read-only; Rust always uses egui)"\n    ))\n    .on_hover_cursor(egui::CursorIcon::Help)\n    .on_hover_text("Legacy frontend selection from Python. The Rust application always uses egui.");\n',
              ''
          )
          '@ | python -

      - name: Format and compile check
        shell: pwsh
        run: |
          cargo fmt
          cargo check --all-targets --all-features
          git diff --check

      - name: Commit cleanup
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/config_controller.rs src/ui/settings.rs
          git commit -m 'Remove residual legacy frontend references [skip ci]'
          git push origin HEAD:agent/final-parity-audit
