name: Final parity validation

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clippy-fix:
    name: Apply clippy fix to audit branch
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/final-parity-audit

      - name: Set up stable Rust with rustfmt and clippy
        shell: pwsh
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      - name: Apply machine-applicable clippy fixes
        run: cargo clippy --fix --all-targets --all-features --allow-dirty --allow-staged -- -D warnings

      - name: Format fixed Rust
        run: cargo fmt

      - name: Commit fix if needed
        shell: pwsh
        run: |
          git diff --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'No clippy fix required.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.rs'
          git commit -m 'Apply clippy fix for final validation [skip ci]'
          git push origin HEAD:agent/final-parity-audit
